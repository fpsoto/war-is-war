name: CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop, "release/**"]

permissions:
  contents: read

# One run per ref; a newer push cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history, for the version

      # Every build carries a version derived from git (see .github/scripts/resolve-version.sh):
      # X.Y.Z-rc.N on release/X.Y.Z branches, X.Y.Z+N.g<sha> elsewhere.
      - name: Resolve version
        id: version
        run: bash .github/scripts/resolve-version.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The scripts are ES modules; node only parses them as such with an .mjs extension.
      - name: Syntax check (version ${{ steps.version.outputs.version }})
        run: |
          for f in ./*.js; do
            cp "$f" "$RUNNER_TEMP/$(basename "$f" .js).mjs"
            node --check "$RUNNER_TEMP/$(basename "$f" .js).mjs"
          done

      # stages.js is pure data with no imports, so it can be loaded and validated here: a typo in
      # a stage fails CI instead of the player's browser.
      - name: Validate the stage data
        run: |
          cp stages.js "$RUNNER_TEMP/stages.mjs"
          node --input-type=module -e "
            const { STAGES, validateStages, stageEnemyTotal } = await import('$RUNNER_TEMP/stages.mjs');
            validateStages();
            for (const s of STAGES) console.log('Stage ' + s.id + ' ' + s.name + ': ' + s.waves.length + ' wave(s), ' + stageEnemyTotal(s) + ' enemies');
          "

      # The game looks its HUD up by id; a renamed element would only fail at runtime in the
      # browser, so catch it here.
      - name: Every element id used by game.js exists in index.html
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const js = readFileSync("game.js", "utf8");
            const html = readFileSync("index.html", "utf8");
            const used = [...js.matchAll(/\$\(\x27([\w-]+)\x27\)/g)].map((m) => m[1]);
            const missing = used.filter((id) => !html.includes(`id="${id}"`));
            if (missing.length) {
              console.error(`Missing in index.html: ${missing.join(", ")}`);
              process.exit(1);
            }
            console.log(`OK: ${used.length} ids found.`);
          '
